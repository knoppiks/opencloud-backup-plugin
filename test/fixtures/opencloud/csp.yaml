# OpenCloud's Content Security Policy for the fixture: the 8.1.0 default,
# measured from its response header (phase-0-findings.md, Phase 9 spike), plus
# ONE addition. 8.1.0's default is 7.2/7.3's plus `blob:` in style-src; the
# superset is used on every leg, older releases simply do not need the extra.
#
# 'wasm-unsafe-eval' in script-src lets the page compile WebAssembly. Backup
# Vault needs it: Argon2id (the Recovery Key's key derivation) comes from
# hash-wasm, and no supported default allows WebAssembly.compile(). Without it the
# setup wizard, "Check my Recovery Key" and the key replacement all fail in the
# browser. It permits WebAssembly compilation only; it is not 'unsafe-eval' and
# does not allow eval() or new Function().
#
# OpenCloud reads this file INSTEAD of its default (PROXY_CSP_CONFIG_FILE_LOCATION),
# so an operator adding the override starts from their own current policy, not
# from this file. See README, "Deployment: installing Backup Vault".
directives:
  child-src:
  - '''self'''
  connect-src:
  - '''self'''
  - 'blob:'
  - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
  - 'https://update.opencloud.eu/'
  default-src:
  - '''none'''
  font-src:
  - '''self'''
  frame-ancestors:
  - '''self'''
  frame-src:
  - '''self'''
  - 'blob:'
  - 'https://embed.diagrams.net/'
  img-src:
  - '''self'''
  - 'data:'
  - 'blob:'
  - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
  manifest-src:
  - '''self'''
  media-src:
  - '''self'''
  object-src:
  - '''self'''
  - 'blob:'
  script-src:
  - '''self'''
  - '''unsafe-inline'''
  - '''wasm-unsafe-eval'''
  style-src:
  - '''self'''
  - '''unsafe-inline'''
  - 'blob:'
