# The OpenCloud versions this plugin is tested against, and therefore the
# versions it supports (compatibility-policy.md §3, decisions.md #25). This is
# the ONLY file that names an OpenCloud image, tag or digest; everything else
# reads it:
#
#   - test/fixtures/opencloud/up.sh picks a leg (OC_LEG, default below) and
#     hands its image to the fixture's compose file,
#   - CI builds its OpenCloud matrix from `legs`, and the nightly canary runs
#     `canary`,
#   - backupd embeds it as the window it warns outside of,
#   - TestREADMESupportedSentence keeps the README's claim equal to it, and
#     TestNoOtherOpenCloudPin fails if an image reference appears elsewhere.
#
# Leg names are roles, not versions, so CI job names stay stable when a pin
# moves. Digests are the multi-arch index digests Docker Hub shows.

# The leg up.sh starts when OC_LEG is unset: the newest release, which is
# where the owner's deployment runs and where breakage arrives first.
default: newest

# The policy's legs (compatibility-policy.md §3, decisions.md #25 as amended):
#
#   - oldest:         the oldest supported release, i.e. the first release of
#                     the previous major, but never below 7.3.0 (see below).
#                     Breaking changes land in minors too (7.5.0 changed the
#                     data URLs), so the oldest version claimed is always run.
#   - previous-major: the newest minor of the previous major.
#   - newest:         the newest release.
#   - production:     channel production: the newest patch of OpenCloud's
#                     current Production line. Its patches come from a side
#                     branch and can differ from main. Every patch of that
#                     line is supported while it is current, even once it is
#                     older than the two majors below.
#
# The Rolling legs span two majors, the newest and the one before (Parse
# refuses more). When a new major ships, the oldest leg moves up to the first
# release of the major before it, and previous-major to that major's newest
# minor. A leg that would pin the same release as another is left out.
#
# 7.3.0 is a floor: on 7.2.x a service account cannot create a project Space
# (the gateway denies the creator's initial manager share, so the state Space
# cannot be provisioned). OpenCloud fixed that in 7.3.0 (reva 2.47.0) and did
# not backport it to the 7.2 Production line (decisions.md, amendment "Moving
# to OpenCloud 8.x"). So there is no production leg until the next Production
# line ships.
legs:
- name: oldest
  channel: rolling
  image: opencloudeu/opencloud-rolling
  tag: 7.3.0
  digest: sha256:f988f14779cbfe26dec78ea3fc2492ae063fe14a069857dd2d5a397a927fc361
- name: previous-major
  channel: rolling
  image: opencloudeu/opencloud-rolling
  tag: 7.5.0
  digest: sha256:6db1cfb06d430a663f16e9f33dcd4596d82a4875be0b4df233c26ce5f667ea74
- name: newest
  channel: rolling
  image: opencloudeu/opencloud-rolling
  tag: 8.1.0
  digest: sha256:8fc64ca861739cc62095cd558814f2eba6a90acf5998d884e439b33a47875da8

# Followed by tag, never by digest: its job is to notice the release nobody has
# pinned yet. Not part of the support window.
canary:
  name: canary
  channel: rolling
  image: opencloudeu/opencloud-rolling
  tag: latest
