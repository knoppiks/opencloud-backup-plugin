name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # Nightly, because the things this repository pins move underneath it: the
  # OpenCloud image the integration tests run against, the Garage image, the
  # base images in the Dockerfile. A scheduled run is how that is noticed here
  # rather than by a deployer.
  schedule:
  - cron: "17 3 * * *"
  # The release workflow runs this whole suite against the tagged commit before
  # it publishes anything.
  workflow_call:

permissions:
  contents: read

# Phase branches are pushed repeatedly while a PR is open; superseded runs are
# pointless. Runs on main are never cancelled so every merged commit keeps a
# complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with go.mod's toolchain pin.
  GO_VERSION: "1.26.0"
  # The web extension's floor is Node 20.19 (vite 8); CI runs the current LTS.
  NODE_VERSION: "24.17.0"
  # Pinned tool versions (AGENTS.md: pin external versions).
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GITLEAKS_VERSION: "8.30.1"
  KUBECONFORM_VERSION: "0.6.7"

jobs:
  build-test:
    name: build / vet / lint / test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: go build
      run: go build ./...

    - name: go vet
      run: go vet ./...

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: ${{ env.GOLANGCI_LINT_VERSION }}

    - name: go test (race)
      run: go test -race ./...

  # The parsers of the formats read forever, and of outside input, for a few
  # seconds each (phase-10-hardening.md §10.4). The seed corpora already run
  # in `go test`; this explores beyond them. fuzz.yml runs longer nightly.
  fuzz:
    name: fuzz (short)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: make fuzz
      run: make fuzz FUZZTIME=10s

    # A failing input is written to testdata/fuzz/<Target>/; committing it
    # makes it a regression case of the plain test run.
    - name: upload failing inputs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-crashers
        path: "**/testdata/fuzz/**"
        if-no-files-found: ignore

  web:
    name: web extension (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}

    # pnpm comes from Corepack, at the version pinned in web/package.json's
    # packageManager field, so CI and a developer machine resolve the same one.
    - name: enable corepack
      run: corepack enable

    - name: install
      working-directory: web
      run: pnpm install --frozen-lockfile

    # ESLint carries one rule that is not a style preference: src/crypto may not
    # import Vue, HTTP or OpenCloud. 8a's outcome calls that independence the
    # reason the interop vectors could be written before any UI existed, and
    # until now it held by care alone.
    - name: lint
      working-directory: web
      run: pnpm lint

    - name: format check
      working-directory: web
      run: pnpm format:check

    - name: typecheck
      working-directory: web
      run: pnpm typecheck

    # The crypto suite reads pkg/keys/testdata/vectors.json directly: it fails
    # when the browser stops agreeing with Go about a byte. The other direction
    # (Go opening browser-produced envelopes) is a Go test and runs in
    # build-test, so neither half can be forgotten.
    - name: test
      working-directory: web
      run: pnpm test

    - name: build
      working-directory: web
      run: pnpm build

    - uses: actions/upload-artifact@v7
      with:
        name: backup-vault-web
        path: web/dist
        if-no-files-found: error

  integration:
    name: integration (Garage fixture)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    # testcontainers-go drives Docker, which is preinstalled on ubuntu-latest.
    - name: go test -tags integration
      run: go test -tags integration ./...

  static-binary:
    name: static binary artifact
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    # Success metric 1 (decisions.md): a single static Go binary.
    - name: build static backupd
      env:
        CGO_ENABLED: "0"
      run: go build -trimpath -ldflags "-s -w" -o dist/backupd ./cmd/backupd

    - name: verify static
      run: |
        file dist/backupd
        if ldd dist/backupd 2>&1 | grep -qv 'not a dynamic executable'; then
          echo "backupd is not statically linked" >&2
          exit 1
        fi

    - uses: actions/upload-artifact@v7
      with:
        name: backupd-static
        path: dist/backupd
        if-no-files-found: error

  decrypt-cross-build:
    name: offline decrypt CLI (linux/darwin/windows)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    # Phase-5 exit criterion: the last-resort recovery tool must build for every
    # desktop OS a family member might have.
    - name: cross-build decrypt
      run: make decrypt-release

    - uses: actions/upload-artifact@v7
      with:
        name: decrypt-cli
        path: dist/decrypt-*
        if-no-files-found: error

  # The supported OpenCloud versions, read from the one file that pins them
  # (compatibility-policy.md §3). Its own job so the matrix below cannot list a
  # version the file does not, or miss one it does.
  opencloud-legs:
    name: OpenCloud legs
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
      # A reusable workflow's `with:` cannot read `env`, so the toolchain pins
      # travel as outputs rather than being repeated in the called workflow.
      go-version: ${{ env.GO_VERSION }}
      node-version: ${{ env.NODE_VERSION }}
    steps:
    - uses: actions/checkout@v7

    # yq (mikefarah, v4) is preinstalled on ubuntu-latest.
    - id: legs
      run: echo "legs=$(yq -o=json -I=0 '[.legs[].name]' pkg/ocversion/versions.yaml)" >> "$GITHUB_OUTPUT"

  # The fixture suite and the browser E2E on every supported leg, all blocking.
  # Job names carry the leg's role, not its version ("opencloud (newest-rolling)
  # / e2e"), so a ruleset can require them across version bumps.
  opencloud:
    name: opencloud (${{ matrix.leg }})
    needs: opencloud-legs
    strategy:
      # One leg failing says nothing about the others; let them all report.
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.opencloud-legs.outputs.legs) }}
    uses: ./.github/workflows/opencloud-suite.yml
    with:
      leg: ${{ matrix.leg }}
      go-version: ${{ needs.opencloud-legs.outputs.go-version }}
      node-version: ${{ needs.opencloud-legs.outputs.node-version }}

  image:
    name: container images (build only)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # Publishing happens only on a `v*` tag (release.yml). What this job buys
    # is that both Dockerfiles — the root one is where the entrypoint contract
    # deploy/ depends on actually lives — cannot rot between releases.
    - name: docker build (service)
      run: docker build -t opencloud-backupd:ci .

    - name: docker build (web bundle)
      run: docker build -t opencloud-backup-vault-web:ci web

  manifests:
    name: k8s manifests (kubeconform)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # Offline schema validation of the /deploy manifests. `kubectl apply
    # --dry-run=client` needs a reachable API server for REST mappings, so CI
    # uses kubeconform (schema-only, no cluster) as the equivalent check.
    - name: install kubeconform
      run: |
        curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
          | tar -xz kubeconform
        sudo mv kubeconform /usr/local/bin/

    - name: validate manifests
      run: kubeconform -strict -summary deploy/

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
    # decisions.md forbids key material ever reaching logs, the UI, or the repo.
    # Full history is scanned, not just the diff, so a secret cannot survive by
    # being introduced in an earlier commit of the same phase branch.
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: install gitleaks
      run: |
        curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz gitleaks
        sudo mv gitleaks /usr/local/bin/

    - name: scan history
      run: gitleaks git . --redact --no-banner
