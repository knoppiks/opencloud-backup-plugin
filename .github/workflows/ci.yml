name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # Nightly, because the things this repository pins move underneath it: the
  # OpenCloud image the integration tests run against, the Garage image, the
  # base images in the Dockerfile. A scheduled run is how that is noticed here
  # rather than by a deployer.
  schedule:
  - cron: "17 3 * * *"

permissions:
  contents: read

# Phase branches are pushed repeatedly while a PR is open; superseded runs are
# pointless. Runs on main are never cancelled so every merged commit keeps a
# complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with go.mod's toolchain pin.
  GO_VERSION: "1.26.0"
  # The web extension's floor is Node 20.19 (vite 8); CI runs the current LTS.
  NODE_VERSION: "24.17.0"
  # Pinned tool versions (AGENTS.md: pin external versions).
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GITLEAKS_VERSION: "8.30.1"
  KUBECONFORM_VERSION: "0.6.7"

jobs:
  build-test:
    name: build / vet / lint / test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: go build
      run: go build ./...

    - name: go vet
      run: go vet ./...

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: ${{ env.GOLANGCI_LINT_VERSION }}

    - name: go test (race)
      run: go test -race ./...

  web:
    name: web extension (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}

    # pnpm comes from Corepack, at the version pinned in web/package.json's
    # packageManager field, so CI and a developer machine resolve the same one.
    - name: enable corepack
      run: corepack enable

    - name: install
      working-directory: web
      run: pnpm install --frozen-lockfile

    # ESLint carries one rule that is not a style preference: src/crypto may not
    # import Vue, HTTP or OpenCloud. 8a's outcome calls that independence the
    # reason the interop vectors could be written before any UI existed, and
    # until now it held by care alone.
    - name: lint
      working-directory: web
      run: pnpm lint

    - name: format check
      working-directory: web
      run: pnpm format:check

    - name: typecheck
      working-directory: web
      run: pnpm typecheck

    # The crypto suite reads pkg/keys/testdata/vectors.json directly: it fails
    # when the browser stops agreeing with Go about a byte. The other direction
    # (Go opening browser-produced envelopes) is a Go test and runs in
    # build-test, so neither half can be forgotten.
    - name: test
      working-directory: web
      run: pnpm test

    - name: build
      working-directory: web
      run: pnpm build

    - uses: actions/upload-artifact@v7
      with:
        name: backup-vault-web
        path: web/dist
        if-no-files-found: error

  integration:
    name: integration (Garage fixture)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    # testcontainers-go drives Docker, which is preinstalled on ubuntu-latest.
    - name: go test -tags integration
      run: go test -tags integration ./...

  static-binary:
    name: static binary artifact
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    # Success metric 1 (decisions.md): a single static Go binary.
    - name: build static backupd
      env:
        CGO_ENABLED: "0"
      run: go build -trimpath -ldflags "-s -w" -o dist/backupd ./cmd/backupd

    - name: verify static
      run: |
        file dist/backupd
        if ldd dist/backupd 2>&1 | grep -qv 'not a dynamic executable'; then
          echo "backupd is not statically linked" >&2
          exit 1
        fi

    - uses: actions/upload-artifact@v7
      with:
        name: backupd-static
        path: dist/backupd
        if-no-files-found: error

  decrypt-cross-build:
    name: offline decrypt CLI (linux/darwin/windows)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    # Phase-5 exit criterion: the last-resort recovery tool must build for every
    # desktop OS a family member might have.
    - name: cross-build decrypt
      run: make decrypt-release

    - uses: actions/upload-artifact@v4
      with:
        name: decrypt-cli
        path: dist/decrypt-*
        if-no-files-found: error

  integration-opencloud:
    name: integration (OpenCloud fixture)
    runs-on: ubuntu-latest
    # Image pull, one-time init, boot, seed, then the tests themselves — plus
    # Garage containers for the ones that need a target as well.
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    # The pinned OpenCloud (test/fixtures/opencloud/docker-compose.yml). up.sh
    # generates the instance's secrets, starts it, waits for readiness and
    # writes fixture.env; seed.sh adds the users, files, Space and grants the
    # tests assert against.
    - name: start the OpenCloud fixture
      run: |
        cd test/fixtures/opencloud
        ./up.sh
        ./seed.sh

    # OPENCLOUD_FIXTURE_REQUIRED turns "no fixture, skip" into "no fixture,
    # fail". Without it this job could pass having run nothing at all, which is
    # precisely what used to happen (review-2026-09.md F7).
    - name: state store, CS3 read path, admin role
      env:
        OPENCLOUD_FIXTURE_REQUIRED: "1"
      run: |
        set -a; . test/fixtures/opencloud/fixture.env; set +a
        go test -tags integration -count=1 ./pkg/cs3/... ./pkg/cs3state/... ./pkg/api/...

    - name: restore Path B against real reva
      env:
        OPENCLOUD_FIXTURE_REQUIRED: "1"
      run: |
        set -a; . test/fixtures/opencloud/fixture.env; set +a
        go test -tags integration -count=1 -run OpenCloud ./pkg/restore/...

    # The Phase-6 exit criteria, over both durable stores (each is a subtest:
    # memory, opencloud). Named explicitly rather than by package: the rest of
    # pkg/backup's integration tests are Garage-only and already run in the
    # `integration` job.
    - name: phase-6 criteria over the real state store
      env:
        OPENCLOUD_FIXTURE_REQUIRED: "1"
      run: |
        set -a; . test/fixtures/opencloud/fixture.env; set +a
        go test -tags integration -count=1 \
          -run 'TestIntegration_Scheduled|TestIntegration_Crashed|TestIntegration_Stale' \
          ./pkg/backup/...

    # Last, deliberately: OC_FIXTURE_DOWN_CMD makes the Path A acceptance test
    # stop OpenCloud for real, which is the criterion ("with OpenCloud down") and
    # also the end of the fixture's usefulness in this job. Within pkg/backup the
    # end-to-end test is defined above it in the same file, so it runs first.
    - name: backup and Path A, with OpenCloud stopped
      env:
        OPENCLOUD_FIXTURE_REQUIRED: "1"
        # Absolute: the test shells out from its own package directory, not from
        # the repository root.
        OC_FIXTURE_DOWN_CMD: ${{ github.workspace }}/test/fixtures/opencloud/down.sh
      run: |
        set -a; . test/fixtures/opencloud/fixture.env; set +a
        go test -tags integration -count=1 -run TestIntegration_OpenCloud ./pkg/backup/...

    - name: fixture logs on failure
      if: failure()
      run: docker logs opencloud-fixture --tail 200 || true

  image:
    name: container image (build only)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # Nothing is published: there is no release process yet, and an image nobody
    # can deploy is not worth a registry, a tag scheme and a signing key. What
    # this job buys is that the Dockerfile — which is where the entrypoint
    # contract deploy/ depends on actually lives — cannot rot unnoticed.
    - name: docker build
      run: docker build -t opencloud-backupd:ci .

  manifests:
    name: k8s manifests (kubeconform)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # Offline schema validation of the /deploy manifests. `kubectl apply
    # --dry-run=client` needs a reachable API server for REST mappings, so CI
    # uses kubeconform (schema-only, no cluster) as the equivalent check.
    - name: install kubeconform
      run: |
        curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
          | tar -xz kubeconform
        sudo mv kubeconform /usr/local/bin/

    - name: validate manifests
      run: kubeconform -strict -summary deploy/

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
    # decisions.md forbids key material ever reaching logs, the UI, or the repo.
    # Full history is scanned, not just the diff, so a secret cannot survive by
    # being introduced in an earlier commit of the same phase branch.
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: install gitleaks
      run: |
        curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz gitleaks
        sudo mv gitleaks /usr/local/bin/

    - name: scan history
      run: gitleaks git . --redact --no-banner
