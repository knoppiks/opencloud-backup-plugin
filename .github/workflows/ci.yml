name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # Nightly, because the things this repository pins move underneath it: the
  # OpenCloud image the integration tests run against, the Garage image, the
  # base images in the Dockerfile. A scheduled run is how that is noticed here
  # rather than by a deployer.
  schedule:
  - cron: "17 3 * * *"
  # The release workflow runs this whole suite against the tagged commit before
  # it publishes anything.
  workflow_call:

permissions:
  contents: read

# Phase branches are pushed repeatedly while a PR is open; superseded runs are
# pointless. Runs on main are never cancelled so every merged commit keeps a
# complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with go.mod's toolchain pin.
  # renovate: datasource=golang-version depName=go
  GO_VERSION: "1.27.3"
  # The web extension's floor is Node 20.19 (vite 8); CI runs the current LTS.
  # renovate: datasource=node-version depName=node
  NODE_VERSION: "24.22.0"
  # golangci-lint, gitleaks, kubeconform, actionlint and govulncheck are
  # pinned in tools/<name>/go.mod and built by make, as locally (#125).
  # The release's tools; keep in step with release.yml.
  # renovate: datasource=github-releases depName=goreleaser/goreleaser
  GORELEASER_VERSION: "v2.18.3"
  # renovate: datasource=github-releases depName=anchore/syft
  SYFT_VERSION: "v1.55.0"

jobs:
  # Building, vetting and linting run beside the unit tests rather than in
  # front of them (#94).
  build-lint:
    name: build / vet / lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: |
          go.sum
          tools/*/go.sum

    # The module files must be what `go mod tidy` would write, and every
    # downloaded module must match go.sum (phase-10-hardening.md §10.8).
    - name: go.mod tidy, modules verified
      run: make mod-check

    - name: go build
      run: go build ./...

    - name: go vet
      run: go vet ./...

    - name: golangci-lint
      run: make lint

    # A weakened depguard or forbidigo rule passes the step above by
    # reporting nothing. This breaks each trust-boundary rule in a copy of
    # the sources and fails unless every violation is reported, with the
    # same golangci-lint.
    - name: trust-boundary rules still fire
      run: make lint-probe

    - name: files agree with .editorconfig
      run: make editorconfig

  # `make test` is the one definition of the unit run: -race, with kopia's
  # `testing` tag for its fast test key derivation (see the Makefile). The
  # release derivation is exercised end to end by `integration (release key
  # derivation)`, built without the tag. `make cover` is that same run with a module-wide
  # coverage profile (-coverpkg=./...), reported in the job summary. No gate
  # yet: Phase 14 sets one once the number is stable.
  unit-test:
    name: unit tests (race)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: make cover (unit tests, race)
      run: make cover

    - name: coverage summary
      if: ${{ !cancelled() && hashFiles('dist/coverage.out') != '' }}
      run: make --no-print-directory cover-summary >> "$GITHUB_STEP_SUMMARY"

  # The parsers of the formats read forever, and of outside input, for a few
  # seconds each (phase-10-hardening.md §10.4). The seed corpora already run
  # in `go test`; this explores beyond them. fuzz.yml runs longer nightly.
  fuzz:
    name: fuzz (short)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: make fuzz
      run: make fuzz FUZZTIME=10s

    # A failing input is written to testdata/fuzz/<Target>/; committing it
    # makes it a regression case of the plain test run.
    - name: collect failing inputs
      if: failure()
      run: make --no-print-directory fuzz-crashers

    - name: upload failing inputs
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fuzz-crashers
        path: dist/fuzz-crashers/
        if-no-files-found: ignore

  web:
    name: web extension (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ env.NODE_VERSION }}

    # pnpm comes from Corepack, at the version pinned in web/package.json's
    # packageManager field, so CI and a developer machine resolve the same one.
    - name: enable corepack
      run: corepack enable

    - name: install
      working-directory: web
      run: pnpm install --frozen-lockfile

    # ESLint carries one rule that is not a style preference: src/crypto may not
    # import Vue, HTTP or OpenCloud. 8a's outcome calls that independence the
    # reason the interop vectors could be written before any UI existed, and
    # until now it held by care alone.
    - name: lint
      working-directory: web
      run: pnpm lint

    - name: format check
      working-directory: web
      run: pnpm format:check

    - name: typecheck
      working-directory: web
      run: pnpm typecheck

    # The crypto suite reads pkg/keys/testdata/vectors.json directly: it fails
    # when the browser stops agreeing with Go about a byte. The other direction
    # (Go opening browser-produced envelopes) is a Go test and runs in
    # unit-test, so neither half can be forgotten.
    - name: test
      working-directory: web
      run: pnpm test

    - name: build
      working-directory: web
      run: pnpm build

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: backup-vault-web
        path: web/dist
        if-no-files-found: error

  # The integration tests only (the unit tests ran in unit-test), under the
  # race detector: this is where the concurrency is (scheduler, background
  # runs, leases, shutdown, kopia uploads). With kopia's `testing` tag, like
  # the unit tests: scrypt is pure Go, the race detector multiplies its cost,
  # and without the tag this job outgrew go test's 10-minute limit (#93).
  integration:
    name: integration (Garage fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    # testcontainers-go drives Docker, which is preinstalled on ubuntu-latest.
    - name: go test -race (integration tests, coverage)
      run: make cover-integration

    - name: coverage summary
      if: ${{ !cancelled() && hashFiles('dist/coverage-integration.out') != '' }}
      run: >-
        make --no-print-directory cover-summary
        COVERPROFILE=dist/coverage-integration.out
        COVERTITLE="integration tests, Garage fixture"
        >> "$GITHUB_STEP_SUMMARY"

  # The same integration tests built without kopia's `testing` tag, so every
  # repository they create derives its key with the release default, plus
  # the tests only such a build compiles (the frozen Take-Out uses the
  # release default). Without -race, which the job above covers.
  integration-release-kdf:
    name: integration (release key derivation)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: go test (integration tests, release key derivation)
      run: make test-integration-release

  static-binary:
    name: static binary artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    # Success metric 1 (decisions.md): a single static Go binary.
    - name: build static backupd
      env:
        CGO_ENABLED: "0"
      run: go build -trimpath -ldflags "-s -w" -o dist/backupd ./cmd/backupd

    - name: verify static
      run: |
        file dist/backupd
        if ldd dist/backupd 2>&1 | grep -qv 'not a dynamic executable'; then
          echo "backupd is not statically linked" >&2
          exit 1
        fi

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: backupd-static
        path: dist/backupd
        if-no-files-found: error

  # Everything a release builds, exactly as release.yml builds it (one
  # definition, .goreleaser.yaml), nothing signed or published: the five
  # decrypt builds the family's last resort needs (phase-5 exit criteria),
  # takeout, the web bundle archive, notices per platform, SBOMs, SHA256SUMS.
  # Then the checks the release runs on its own assets, and the tests of the
  # release scripts, including that the asset check still refuses damage
  # (phase-11 §11.3, #104).
  release-snapshot:
    name: release assets (snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    # The tags, for the stamp (`git describe`).
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    # This job builds what a release ships, and the release runs it (as
    # workflow_call, on the tag): there it reads no Actions cache, which any
    # pull request's run can write (#125, zizmor cache-poisoning).
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning] off on a tag

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ env.NODE_VERSION }}
        package-manager-cache: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning] off on a tag

    - name: enable corepack
      run: corepack enable

    - name: install web dependencies
      working-directory: web
      run: pnpm install --frozen-lockfile

    - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        version: ${{ env.GORELEASER_VERSION }}
        install-only: true

    - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        syft-version: ${{ env.SYFT_VERSION }}

    - name: make release-snapshot
      run: make release-snapshot

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-snapshot
        path: |
          dist/release/*.tar.gz
          dist/release/*.zip
          dist/release/*.spdx.json
          dist/release/SHA256SUMS
          dist/release-assets/
        if-no-files-found: error

  # The supported OpenCloud versions, read from the one file that pins them
  # (compatibility-policy.md §3). Its own job so the matrix below cannot list a
  # version the file does not, or miss one it does.
  opencloud-legs:
    name: OpenCloud legs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
      # A reusable workflow's `with:` cannot read `env`, so the toolchain pins
      # travel as outputs rather than being repeated in the called workflow.
      go-version: ${{ env.GO_VERSION }}
      node-version: ${{ env.NODE_VERSION }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # yq (mikefarah, v4) is preinstalled on ubuntu-latest.
    - id: legs
      run: echo "legs=$(yq -o=json -I=0 '[.legs[].name]' internal/ocversion/versions.yaml)" >> "$GITHUB_OUTPUT"

  # The fixture suite and the browser E2E on every supported leg, all blocking.
  # Job names carry the leg's role, not its version ("opencloud (newest)
  # / e2e"), so a ruleset can require them across version bumps.
  opencloud:
    name: opencloud (${{ matrix.leg }})
    needs: opencloud-legs
    strategy:
      # One leg failing says nothing about the others; let them all report.
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.opencloud-legs.outputs.legs) }}
    uses: ./.github/workflows/opencloud-suite.yml
    with:
      leg: ${{ matrix.leg }}
      go-version: ${{ needs.opencloud-legs.outputs.go-version }}
      node-version: ${{ needs.opencloud-legs.outputs.node-version }}

  image:
    name: container images (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    # The tags, for `git describe`: the images are stamped the way a release
    # stamps them (make stamp).
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    # Publishing happens only on a `v*` tag (release.yml). What this job buys
    # is that both Dockerfiles — the root one is where the entrypoint contract
    # deploy/ depends on actually lives — cannot rot between releases.
    - name: docker build (service)
      run: make image IMAGE_TAG=ci

    - name: docker build (web bundle)
      run: make web-image IMAGE_TAG=ci

    # Every artifact reports the same version and commit (#102).
    - name: images report one version
      run: make image-stamp-check IMAGE_TAG=ci

    # The web image has no shell: its entrypoint must do the initContainer's
    # copy by itself, run without arguments, as README documents it.
    - name: web image installs the bundle
      run: |
        mkdir -m 777 "$RUNNER_TEMP/extensions"
        docker run --rm --network none -v "$RUNNER_TEMP/extensions:/extensions" opencloud-backup-vault-web:ci
        test -f "$RUNNER_TEMP/extensions/backup-vault/manifest.json"
        test -f "$RUNNER_TEMP/extensions/backup-vault/THIRD_PARTY_NOTICES"

    # Trivy over both images: every HIGH and CRITICAL finding is listed, a
    # fixable CRITICAL one fails (#116). Nightly too, for advisories
    # published after the base image was pinned. Then the probe that proves
    # the scan still refuses.
    - name: known vulnerabilities
      run: make image-scan IMAGE_TAG=ci

    - name: the scan still refuses
      run: make image-scan-probe

  manifests:
    name: k8s manifests (kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: |
          go.sum
          tools/*/go.sum

    # Offline schema validation of the /deploy manifests. `kubectl apply
    # --dry-run=client` needs a reachable API server for REST mappings, so CI
    # uses kubeconform (schema-only, no cluster) as the equivalent check.
    - name: validate manifests
      run: make k8s-validate

    # The manifests name only published versions of the images (#110): a
    # tag that was never released, or `latest`, fails here. Nightly too, so
    # a tag removed from the registry is noticed. docker buildx and jq are
    # preinstalled; ghcr.io serves public images without a login.
    - name: images are published
      run: make deploy-images

  # The Go side of the license audit (phase-11 §11.1): every program on every
  # platform anything ships for, against the allow-list, and the probe that
  # proves the check still refuses. The bundle is audited by its own build
  # (web job); each image generates the notices for what it contains.
  licenses:
    name: third-party licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: license check, notices
      run: make licenses

    - name: the check still refuses
      run: make license-probe

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: third-party-notices
        path: dist/THIRD_PARTY_NOTICES
        if-no-files-found: error

  # Known vulnerabilities the shipped Go programs can reach, on every
  # platform they ship for (#116). The standard library counts, so a Go
  # security release fails this until the toolchain pin moves. Nightly too:
  # advisories arrive without a commit.
  vulncheck:
    name: known vulnerabilities (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: |
          go.sum
          tools/*/go.sum

    - name: make vulncheck
      run: make vulncheck

  # Known vulnerabilities in what the web bundle ships (#116): osv-scanner
  # over the lockfile, judged against the packages the build put into the
  # bundle; high, critical and unrated ones there fail, the rest is listed.
  web-audit:
    name: known vulnerabilities (web bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: enable corepack
      run: corepack enable

    - name: install
      working-directory: web
      run: pnpm install --frozen-lockfile

    - name: make web-audit
      run: make web-audit

  # Renovate keeps every pin current (#116); a config it cannot read stops
  # all of that. The pinned validator, strict.
  renovate-config:
    name: renovate config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: make renovate-config
      run: make renovate-config

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    # decisions.md forbids key material ever reaching logs, the UI, or the repo.
    # Full history is scanned, not just the diff, so a secret cannot survive by
    # being introduced in an earlier commit of the same phase branch.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: |
          go.sum
          tools/*/go.sum

    # HEAD's ancestry, then the tree (scripts/secret-scan.sh), as locally.
    - name: make secret-scan
      run: make secret-scan

  # The pipeline's own files (#125): workflows (actionlint with shellcheck
  # on their scripts, zizmor), shell scripts (shellcheck), Dockerfiles
  # (hadolint). Any finding fails; exceptions carry their reason inline or
  # in .github/zizmor.yml. The token lets zizmor's online audits run
  # (impostor commits, known-vulnerable actions); it can read, nothing more.
  pipeline-lint:
    name: pipeline lint (workflows, scripts, Dockerfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: |
          go.sum
          tools/*/go.sum

    - name: make pipeline-lint
      env:
        GH_TOKEN: ${{ github.token }}
      run: make pipeline-lint
