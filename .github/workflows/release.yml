name: Release

# A `v*` tag on main becomes a DRAFT GitHub Release (phase-11 §11.3, #104):
#
#   decrypt_<ver>_<os>_<arch>     the offline recovery CLI, five platforms
#   takeout_<ver>_linux_<arch>    the admin Take-Out tool, outside the image
#   backup-vault_<ver>.tar.gz     the web extension bundle
#   *.spdx.json                   SBOMs: per archive, per image and platform
#   images.txt                    both images, by digest
#   SHA256SUMS                    every asset above
#   SHA256SUMS.sigstore.json      its keyless cosign signature
#
# plus GitHub build provenance for every asset, and the two images
#
#   ghcr.io/<owner>/opencloud-backupd            the service (root Dockerfile)
#   ghcr.io/<owner>/opencloud-backup-vault-web   the web bundle, for an
#                                                initContainer (web/Dockerfile)
#
# pushed BY DIGEST ONLY, signed, with SBOM and provenance attestations. They
# get their version tags when the owner publishes the draft
# (release-publish.yml), so reviewing the draft gates everything. A draft
# that is never published leaves untagged digests behind; delete them by
# hand.
#
# All artifacts carry the same version (decision #24): the tag.
on:
  push:
    tags: [ "v*" ]
  # Re-runs a release without moving its tag (a flaky job, a fixed workflow
  # secret): run this workflow ON THE TAG ("Use workflow from" -> Tags). The
  # draft is replaced; a published release is never touched again.
  workflow_dispatch:

permissions:
  contents: read

# One run per tag at a time; a second waits instead of racing the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in step with ci.yml (internal/buildinfo/toolchain_test.go).
  # renovate: datasource=golang-version depName=go
  GO_VERSION: "1.26.9"
  # renovate: datasource=node-version depName=node
  NODE_VERSION: "24.17.0"
  # renovate: datasource=github-releases depName=goreleaser/goreleaser
  GORELEASER_VERSION: "v2.18.3"
  # renovate: datasource=github-releases depName=anchore/syft
  SYFT_VERSION: "v1.54.1"
  # Images are signed with cosign v3, and README tells users to verify them
  # with v3 or newer (#108): an older cosign does not find v3's signatures.
  # renovate: datasource=github-releases depName=sigstore/cosign
  COSIGN_VERSION: "v3.0.6"

jobs:
  # Nothing is built for a ref that is not a release tag of a commit on
  # main (review R5: an rc was once tagged on an unmerged branch), nor for a
  # tag whose release is already published, nor for a final release that
  # ships an issue without exactly one kind/ label: the notes group by it
  # (#112). A release candidate only warns about such issues.
  guard:
    name: release tag on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - id: tag
      env:
        REF_TYPE: ${{ github.ref_type }}
        TAG: ${{ github.ref_name }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ "$REF_TYPE" != tag ]; then
          echo "::error::run this workflow on a release tag, not on a $REF_TYPE"
          exit 1
        fi
        if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
          echo "::error::$TAG is not vX.Y.Z or vX.Y.Z-rc.N"
          exit 1
        fi
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::$TAG ($GITHUB_SHA) is not on main"
          exit 1
        fi
        # A draft is not visible to this token; a published release is.
        if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
          echo "::error::the release $TAG is already published"
          exit 1
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

    # The issues this release ships, for its notes (scripts/release-issues.sh).
    - name: issues this release ships
      env:
        TAG: ${{ steps.tag.outputs.tag }}
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p dist
        scripts/release-issues.sh "$TAG" > dist/release-issues.json
        jq -r '"\(length) issue(s): " + ([.[] | "#\(.number)"] | join(" "))' dist/release-issues.json

    - name: every issue has a kind
      env:
        TAG: ${{ steps.tag.outputs.tag }}
      run: |
        if [[ $TAG == *-rc.* ]]; then
          scripts/check-issues.sh -w dist/release-issues.json
        else
          scripts/check-issues.sh dist/release-issues.json
        fi

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-issues
        path: dist/release-issues.json
        if-no-files-found: error

  # The full CI suite, against the tagged commit. Nothing is pushed from a
  # commit that did not pass it, whatever passed on main before.
  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml

  # Built beside CI: it publishes nothing by itself.
  web-bundle:
    name: web bundle archive
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    # No Actions cache: the bundle is a release asset (see the release job).
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ env.NODE_VERSION }}
        package-manager-cache: false

    - name: enable corepack
      run: corepack enable

    - name: install
      working-directory: web
      run: pnpm install --frozen-lockfile

    # package.json carries the release's version in the build only; the
    # committed file stays 0.0.0 (decision #24: the tag is the version).
    - name: make web-archive
      env:
        TAG: ${{ needs.guard.outputs.tag }}
      run: |
        (cd web && npm pkg set version="${TAG#v}")
        make web-archive VERSION="$TAG"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-assets-web
        path: dist/release-assets/
        if-no-files-found: error

  images:
    name: image ${{ matrix.image }}
    needs: [ guard, ci ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write     # cosign keyless, provenance
      attestations: write
    strategy:
      matrix:
        include:
        - image: opencloud-backupd
          file: Dockerfile
        # Built from the repository root too: its entrypoint is a Go
        # program (web/Dockerfile.dockerignore keeps the context small).
        - image: opencloud-backup-vault-web
          file: web/Dockerfile
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    # The same stamp `make` uses, with the version set to the tag itself:
    # `git describe` may name another tag on the same commit (an -rc).
    - id: stamp
      run: make --no-print-directory stamp VERSION="$TAG" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: ${{ env.COSIGN_VERSION }}

    - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        syft-version: ${{ env.SYFT_VERSION }}

    # By digest, without a tag. BuildKit's own provenance and SBOM are off:
    # each image gets one of each, from the steps below.
    - id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .
        file: ${{ matrix.file }}
        platforms: linux/amd64,linux/arm64
        outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
        provenance: false
        sbom: false
        # The OCI labels are the Dockerfiles' own, from this stamp.
        build-args: |
          VERSION=${{ steps.stamp.outputs.version }}
          COMMIT=${{ steps.stamp.outputs.commit }}
          DATE=${{ steps.stamp.outputs.date }}

    # The images as pushed, every platform, before anything vouches for
    # them: a fixable CRITICAL vulnerability stops the release here, with
    # the digests unsigned and untagged (#116). CI scanned its own build of
    # the same commit; this is the arm64 image too, and today's database.
    - name: known vulnerabilities
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        manifest=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Manifest}}')
        refs=$(jq -r --arg image "$IMAGE" \
          '.manifests[] | select(.platform.os == "linux") | "\($image)@\(.digest)"' <<<"$manifest")
        [ "$(wc -l <<<"$refs")" -eq 2 ] || { echo "::error::expected two platform images in $IMAGE@$DIGEST"; exit 1; }
        make image-scan SCAN_IMAGES="$(paste -sd' ' <<<"$refs")"

    # The index and each platform's image.
    - name: sign
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: cosign sign --yes --recursive "$IMAGE@$DIGEST"

    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ env.IMAGE }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true

    # One SPDX SBOM per platform image: a release asset, and an attestation
    # on that image's digest.
    - name: SBOMs
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
        NAME: ${{ matrix.image }}
      run: |
        mkdir -p dist/release-assets dist/images
        manifest=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Manifest}}')
        for platform in linux/amd64 linux/arm64; do
          os=${platform%/*} arch=${platform#*/}
          pdigest=$(jq -r --arg os "$os" --arg arch "$arch" \
            '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest' <<<"$manifest")
          [[ $pdigest == sha256:* ]] || { echo "::error::no $platform image in $IMAGE@$DIGEST"; exit 1; }
          sbom="dist/release-assets/${NAME}_${TAG#v}_${os}_${arch}.spdx.json"
          syft "registry:$IMAGE@$pdigest" -o "spdx-json=$sbom"
          cosign attest --yes --type spdxjson --predicate "$sbom" "$IMAGE@$pdigest"
        done
        echo "$IMAGE@$DIGEST" > "dist/images/$NAME.txt"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-assets-${{ matrix.image }}
        path: dist/release-assets/
        if-no-files-found: error

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: image-${{ matrix.image }}
        path: dist/images/
        if-no-files-found: error

  # The CLI binaries, archives, binary SBOMs, SHA256SUMS over every asset,
  # its signature, and the draft release (.goreleaser.yaml), then build
  # provenance for every asset SHA256SUMS lists.
  release:
    name: draft release
    needs: [ guard, ci, web-bundle, images ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write     # the draft release
      id-token: write     # cosign keyless, provenance
      attestations: write
    env:
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    # No Actions cache in a job that publishes: any pull request's run can
    # write it (#125, zizmor cache-poisoning).
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        version: ${{ env.GORELEASER_VERSION }}
        install-only: true

    - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        syft-version: ${{ env.SYFT_VERSION }}

    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: ${{ env.COSIGN_VERSION }}

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: release-assets-*
        path: dist/release-assets
        merge-multiple: true

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: image-*
        path: dist/images
        merge-multiple: true

    # Not under release-assets/: it is not a release asset.
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-issues
        path: dist

    # The draft's body, which the owner edits before publishing. It is the
    # changelog: there is no CHANGELOG file (#112).
    - name: image list, release notes
      run: |
        LC_ALL=C sort dist/images/*.txt > dist/release-assets/images.txt
        scripts/release-notes.sh "$TAG" dist/release-assets/images.txt \
          dist/release-issues.json internal/ocversion/versions.yaml > dist/release-notes.md

    # GORELEASER_CURRENT_TAG: an rc and its release may tag the same commit.
    - name: make release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GORELEASER_CURRENT_TAG: ${{ needs.guard.outputs.tag }}
      run: make release VERSION="$TAG" RELEASE_NOTES=dist/release-notes.md

    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-checksums: dist/release/SHA256SUMS
