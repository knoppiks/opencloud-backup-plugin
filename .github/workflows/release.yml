name: Release

# Publishes the two images a deployment needs, from a `v*` tag only:
#
#   ghcr.io/<owner>/opencloud-backupd            the service (root Dockerfile)
#   ghcr.io/<owner>/opencloud-backup-vault-web   the web bundle, for an
#                                                initContainer (web/Dockerfile)
#
# Both carry the same version, because the extension and the API it calls are
# released together; mixing versions is not a supported configuration.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  # The full CI suite, against the tagged commit. Nothing is published from a
  # commit that did not pass it, whatever passed on main before.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish ${{ matrix.image }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
        - image: opencloud-backupd
          file: Dockerfile
        # Built from the repository root too: its entrypoint is a Go
        # program (web/Dockerfile.dockerignore keeps the context small).
        - image: opencloud-backup-vault-web
          file: web/Dockerfile
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # The same stamp `make` uses, with the version set to the tag itself:
    # `git describe` may name another tag on the same commit (an -rc).
    - id: stamp
      env:
        TAG: ${{ github.ref_name }}
      run: make --no-print-directory stamp VERSION="$TAG" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-qemu-action@v3

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # v1.2.3 -> 1.2.3 and 1.2. No `latest`: a deployment pins a version, and a
    # moving tag would make "the image that was tested" unanswerable.
    - id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        flavor: latest=false
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    # Both Dockerfiles build on the runner's platform and only the final
    # stage is per-architecture, so arm64 costs no emulated compile.
    - uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.file }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        # The OCI labels are the Dockerfiles' own, from this stamp; the
        # metadata action's would replace `created` with the build time.
        build-args: |
          VERSION=${{ steps.stamp.outputs.version }}
          COMMIT=${{ steps.stamp.outputs.commit }}
          DATE=${{ steps.stamp.outputs.date }}
