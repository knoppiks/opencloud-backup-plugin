name: Release published

# Publishing a draft release is the owner's approval of it (phase-11 §11.3,
# #104). Only then do the images release.yml pushed by digest get their
# version tags:
#
#   X.Y.Z   always (X.Y.Z-rc.N for a pre-release)
#   X.Y     for a release, while it is the newest published one of X.Y
#
# No `latest`: a deployment pins a version, and a moving tag would make "the
# image that was tested" unanswerable. The digests come from the release's
# images.txt, which is accepted only if SHA256SUMS lists it, and SHA256SUMS
# only if release.yml signed it at this tag.
on:
  release:
    types: [ published ]

permissions:
  contents: read

env:
  # Keep in step with release.yml.
  COSIGN_VERSION: "v3.0.6"

concurrency:
  group: release-published-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  tag-images:
    name: tag images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
    # The scripts as they were at the tag.
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.release.tag_name }}

    - uses: sigstore/cosign-installer@v4.1.2 # no major tag upstream
      with:
        cosign-release: ${{ env.COSIGN_VERSION }}

    - name: verify the image list
      run: |
        mkdir -p "$RUNNER_TEMP/release"
        gh release download "$TAG" --dir "$RUNNER_TEMP/release" \
          --pattern images.txt --pattern SHA256SUMS --pattern SHA256SUMS.sigstore.json
        scripts/verify-release.sh -t "$TAG" "$RUNNER_TEMP/release"

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: tag the digests
      run: |
        published=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 \
          --json tagName --jq '.[].tagName')
        # shellcheck disable=SC2086 # one tag per word
        tag_list=$(scripts/image-tags.sh "$TAG" $published)
        mapfile -t tags <<<"$tag_list"
        while IFS= read -r ref; do
          repo=${ref%@*} digest=${ref#*@}
          args=()
          for t in "${tags[@]}"; do
            args+=(--tag "$repo:$t")
          done
          echo "$ref -> ${tags[*]}"
          docker buildx imagetools create "${args[@]}" "$ref"
          # The tag must name the signed digest itself, not a copy.
          for t in "${tags[@]}"; do
            got=$(docker buildx imagetools inspect "$repo:$t" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$got" != "$digest" ]; then
              echo "::error::$repo:$t is $got, want $digest"
              exit 1
            fi
          done
        done < "$RUNNER_TEMP/release/images.txt"
