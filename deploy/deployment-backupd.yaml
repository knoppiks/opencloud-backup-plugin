apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud-backupd
  labels:
    app.kubernetes.io/name: opencloud-backup
    app.kubernetes.io/component: backupd
spec:
  # Single replica, enforced through the rollout as well as the count. The
  # backup service must never run twice against one state Space (decisions.md
  # #16): the state backend has no compare-and-set, so two instances can mark
  # each other's runs failed and dispatch the same Space at once. The default
  # RollingUpdate strategy starts the new pod before stopping the old one and
  # would do exactly that on every image update.
  #
  # The service also checks this itself and REFUSES TO START while another
  # instance's record is live, so a mistake here costs a failed rollout rather
  # than a corrupted run history.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opencloud-backup
      app.kubernetes.io/component: backupd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencloud-backup
        app.kubernetes.io/component: backupd
    spec:
      # Long enough for the scheduler to drain (30 s) and HTTP to finish (10 s),
      # plus margin. A run cut short by the deadline fails through the normal
      # path and is recovered from its lease on the next start.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backupd
        # Image is built and pushed by CI; tag is set at deploy time.
        image: ghcr.io/knoppiks/opencloud-backupd:latest
        imagePullPolicy: IfNotPresent
        args: [ "/backupd" ]
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: BACKUPD_ADDR
          value: ":8080"
        # THE LISTENER IS PLAIN HTTP. A Space's Data Key crosses it once, at key
        # setup, so it MUST sit behind a TLS-terminating ingress on the same
        # origin as OpenCloud. A deployment with nothing in front of it sets
        # TLS_CERT_FILE and TLS_KEY_FILE instead (both, or neither).
        # - name: TLS_CERT_FILE
        #   value: "/etc/backupd-tls/tls.crt"
        # - name: TLS_KEY_FILE
        #   value: "/etc/backupd-tls/tls.key"
        # Phase 2 — auth & space enumeration.
        # OIDC: the backend validates OpenCloud IDP bearer tokens (JWKS discovery
        # from the issuer, retried in the background — an IdP that is not up yet
        # answers 503 on authenticated routes instead of preventing startup).
        #
        # OIDC_AUDIENCE is REQUIRED whenever OIDC_ISSUER is set: one OpenCloud
        # issuer mints tokens for several clients, and without it a token issued
        # for any of them is accepted here. Set it to the client id the browser
        # UI authenticates with.
        - name: OIDC_ISSUER
          value: "https://cloud.example.org"
        - name: OIDC_AUDIENCE
          value: "REPLACE_ME_WITH_THE_OIDC_CLIENT_ID"
        # Admin detection (decisions.md #13). Primary: graph appRoleAssignments —
        # set OC_BASE_URL; OC_ADMIN_APP_ROLE_ID defaults to the pinned 7.3.0 Admin
        # role id (phase-0-findings.md) and only needs overriding on other builds.
        # Fallback: set ADMIN_SUBJECT_ALLOWLIST (comma-separated subs) instead.
        #
        # OC_BASE_URL also backs group-grant resolution (graph memberOf,
        # decisions.md #20) and is NOT optional for that: without it, a Space
        # shared with a group answers 503 for the members who reach it through
        # that group. Set it even when using ADMIN_SUBJECT_ALLOWLIST.
        - name: OC_BASE_URL
          value: "https://cloud.example.org"
        # - name: OC_ADMIN_APP_ROLE_ID
        #   value: "71881883-1768-46bd-a24d-a356a2afdf7f"
        # - name: ADMIN_SUBJECT_ALLOWLIST
        #   value: ""
        # CS3 read path (decisions.md #11). The worker authenticates with an
        # OpenCloud service account; the id/secret are Secret-backed and are the
        # same custody class as the wrapping keys.
        #
        # The service account is NOT optional: the worker reads every Space with
        # it and the state Space lives behind it. Its secret grants owner scope
        # on every Space in the deployment — the highest-value credential here,
        # ahead of the wrapping keys, because it reaches plaintext.
        - name: CS3_GATEWAY_ADDR
          value: "opencloud-gateway:9142"
        - name: OC_SERVICE_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: opencloud-backup-wrap-keys
              key: service-account-id
        - name: OC_SERVICE_ACCOUNT_SECRET
          valueFrom:
            secretKeyRef:
              name: opencloud-backup-wrap-keys
              key: service-account-secret
        # Phase 3 — key service. The Server Runtime Wrap key wraps per-Space Data
        # Keys so unattended runs are possible (decisions.md #1). Base64 of 32
        # random bytes. Cluster/KMS custody: never in the admin UI, never logged.
        # Without it the backup key endpoints stay unavailable (fail closed).
        - name: SRW_KEY
          valueFrom:
            secretKeyRef:
              name: opencloud-backup-wrap-keys
              key: srw-wrapping-key
        # Phase 4 — the Target Wrap key decrypts the stored S3 target credentials
        # in worker memory at run time (decisions.md #14). Distinct from SRW so
        # the two rotate independently — the service REFUSES TO START if the two
        # are set to the same value. Without it backup runs stay unavailable.
        - name: TW_KEY
          valueFrom:
            secretKeyRef:
              name: opencloud-backup-wrap-keys
              key: tw-wrapping-key
        # Retiring either key: stop the service, then run the rotation command
        # from this same image with the retiring key in SRW_KEY_OLD / TW_KEY_OLD
        # and the new one in SRW_KEY / TW_KEY:
        #
        #   backupd rotate-srw -service-stopped
        #   backupd rotate-tw  -service-stopped
        #
        # Data keys, snapshots and users' Recovery Keys are untouched, nothing is
        # re-uploaded, and re-running finishes an interrupted rotation. Remove the
        # old key from this Secret afterwards. See the runbook in README.md.
        # Phase 4 — pipeline tuning. All optional.
        #   BACKUP_PARALLELISM                 files hashed/uploaded concurrently
        #                                      (0 = one per CPU).
        #   BACKUP_UPLOAD_BYTES_PER_SECOND     bandwidth cap towards the target
        #   BACKUP_DOWNLOAD_BYTES_PER_SECOND   (0 = unlimited).
        # - name: BACKUP_PARALLELISM
        #   value: "4"
        # - name: BACKUP_UPLOAD_BYTES_PER_SECOND
        #   value: "10485760"
        #
        # BACKUP_WORK_DIR is the parent of the per-run kopia config and cache. It
        # MUST be memory-backed: the cache holds repository content, and nothing
        # about a run should be recoverable from a disk after the pod is gone.
        # The service REFUSES TO START otherwise, unless
        # BACKUP_WORK_DIR_ALLOW_DISK=true says the operator accepts it.
        # (Target credentials are never written there at all — they live only in
        # process memory, decisions.md #14.)
        - name: BACKUP_WORK_DIR
          value: "/work"
        # Phase 6 — durable state. The service keeps its own memory (schedules,
        # run history, wrapped key envelopes, target records) in a dedicated
        # OpenCloud Space reached over CS3 with the service account. That Space
        # must be one NO END USER IS A MEMBER OF: a member could delete the
        # service's state, and this is not a user's document. The service checks
        # this at startup and REFUSES TO START against a personal Space or one
        # with any member grant.
        #
        # It is REQUIRED. Without it the service would keep schedules, history
        # and every wrapped Data Key in memory and lose them on the next pod
        # restart — silently, long after the ceremony everyone watched. A
        # throwaway instance says so explicitly with STATE_BACKEND=memory.
        # See the state-Space runbook in README.md before setting this.
        - name: STATE_SPACE_ID
          value: "REPLACE_ME_WITH_THE_STATE_SPACE_ID"
        # - name: STATE_PREFIX
        #   value: ".backup-service-state"
        # - name: STATE_BACKEND
        #   value: "memory"   # smoke tests only: nothing survives a restart
        # Phase 6 — scheduling. All optional.
        #   SCHEDULE_TIMEZONE          schedules are local time to the family,
        #                              e.g. "Europe/Berlin" (default UTC).
        #   SCHEDULER_MAX_CONCURRENT   simultaneous scheduled runs (default 2).
        #   JOB_HISTORY_DAYS           how long finished runs are kept
        #                              (default 365; time-based, like every
        #                              retention here — decisions.md #10).
        # - name: SCHEDULE_TIMEZONE
        #   value: "Europe/Berlin"
        # - name: SCHEDULER_MAX_CONCURRENT
        #   value: "2"
        # - name: JOB_HISTORY_DAYS
        #   value: "365"
        # Phase 6 — operator notifications. Space members' notifications are
        # recorded and served through the API; these settings only add email
        # delivery for OPERATOR events, which never name a Space or a user
        # (decisions.md #15). Without them notifications are recorded and logged.
        # - name: NOTIFY_OPERATOR_EMAIL
        #   value: "admin@example.org"
        # - name: SMTP_HOST
        #   value: "smtp.example.org"
        # - name: SMTP_PORT
        #   value: "587"
        # - name: SMTP_FROM
        #   value: "backup@example.org"
        # - name: SMTP_USERNAME
        #   value: "backup"
        # - name: SMTP_PASSWORD
        #   valueFrom: { secretKeyRef: { name: opencloud-backup-wrap-keys, key: smtp-password } }
        envFrom:
        - configMapRef:
            name: opencloud-backup-bootstrap-target
        # Bootstrap credentials for the optional default target, if enabled.
        # They are sealed with the TW key on first start and only ciphertext is
        # kept (decisions.md #14). Admin-managed targets need none of this.
        # - name: BOOTSTRAP_S3_ACCESS_KEY_ID
        #   valueFrom: { secretKeyRef: { name: opencloud-backup-wrap-keys, key: bootstrap-s3-access-key-id } }
        # - name: BOOTSTRAP_S3_SECRET_ACCESS_KEY
        #   valueFrom: { secretKeyRef: { name: opencloud-backup-wrap-keys, key: bootstrap-s3-secret-access-key } }
        #
        # Target S3 credentials for admin-managed targets are NOT injected here —
        # they are admin-entered and stored TW-wrapped in the app
        # (decisions.md #12/#14). Never echo secrets to logs.
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: "1"
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          # /readyz probes the CS3 gateway (Phase 2); 503 until it is reachable.
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ "ALL" ]
        volumeMounts:
        - name: work
          mountPath: /work
        - name: tmp
          mountPath: /tmp
      volumes:
      # kopia connect writes a local config + cache per run; a writable directory
      # is required since the root filesystem is read-only
      # (phase-0-findings.md Spike 2, "Repo connect is stateful on local disk").
      #
      # Memory-backed on purpose: the cache holds repository content, and a
      # memory medium means a killed pod leaves nothing behind to find. The
      # service checks this at startup. sizeLimit counts against the pod's memory
      # limit, so raise both together for very large Spaces.
      - name: work
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
