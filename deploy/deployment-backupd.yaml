apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud-backupd
  labels:
    app.kubernetes.io/name: opencloud-backup
    app.kubernetes.io/component: backupd
spec:
  # Single replica for v1: the worker holds per-run repo state and maintenance
  # ownership (phase-0-findings.md Spike 2). Scaling out needs coordination and
  # is out of scope for Phase 1.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opencloud-backup
      app.kubernetes.io/component: backupd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencloud-backup
        app.kubernetes.io/component: backupd
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backupd
        # Image is built and pushed by CI; tag is set at deploy time.
        image: ghcr.io/knoppiks/opencloud-backupd:latest
        imagePullPolicy: IfNotPresent
        args: [ "/backupd" ]
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: BACKUPD_ADDR
          value: ":8080"
        # Phase 2 — auth & space enumeration.
        # OIDC: the backend validates OpenCloud IDP bearer tokens (JWKS discovery
        # from the issuer). OIDC_AUDIENCE is optional (enforced only when set).
        - name: OIDC_ISSUER
          value: "https://cloud.example.org"
        # - name: OIDC_AUDIENCE
        #   value: "backup-api"
        # Admin detection (decisions.md #13). Primary: graph appRoleAssignments —
        # set OC_BASE_URL; OC_ADMIN_APP_ROLE_ID defaults to the pinned 7.3.0 Admin
        # role id (phase-0-findings.md) and only needs overriding on other builds.
        # Fallback: set ADMIN_SUBJECT_ALLOWLIST (comma-separated subs) instead.
        - name: OC_BASE_URL
          value: "https://cloud.example.org"
        # - name: OC_ADMIN_APP_ROLE_ID
        #   value: "71881883-1768-46bd-a24d-a356a2afdf7f"
        # - name: ADMIN_SUBJECT_ALLOWLIST
        #   value: ""
        # CS3 read path (decisions.md #11). The service-account id/secret come
        # from a Secret in the scheduler phase; wired here so /spaces works.
        - name: CS3_GATEWAY_ADDR
          value: "opencloud-gateway:9142"
        # - name: OC_SERVICE_ACCOUNT_ID
        #   valueFrom: { secretKeyRef: { name: opencloud-backup-wrap-keys, key: service-account-id } }
        # - name: OC_SERVICE_ACCOUNT_SECRET
        #   valueFrom: { secretKeyRef: { name: opencloud-backup-wrap-keys, key: service-account-secret } }
        envFrom:
        - configMapRef:
            name: opencloud-backup-bootstrap-target
        # Wrapping keys (SRW + TW) and the OC service-account credentials are
        # injected from Secrets in a later phase; the placeholder Secret exists
        # now (secret-wrap-keys.yaml -> opencloud-backup-wrap-keys). Target S3
        # credentials are NOT injected here — they are admin-entered and stored
        # TW-wrapped in the app (decisions.md #12/#14). Never echo secrets to logs.
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: "1"
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          # /readyz probes the CS3 gateway (Phase 2); 503 until it is reachable.
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ "ALL" ]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      # kopia connect writes a local config + cache per run; a writable tmp is
      # required since the root filesystem is read-only
      # (phase-0-findings.md Spike 2, "Repo connect is stateful on local disk").
      - name: tmp
        emptyDir: { }
