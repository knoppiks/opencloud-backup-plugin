# The operator commands, as templates: CronJobs that never run by themselves
# (suspended, and scheduled for 31 February). Run one with
#
#   kubectl create job --from=cronjob/opencloud-backup-provision-state-space provision-1
#   kubectl logs job/provision-1
#
# They are not Jobs because a Job's template is immutable: the next
# `kubectl apply -k` after a change to the image or the configuration would
# fail on it. deploy/kustomize/README.md says when to run which.
#
# Their pods are not the service's (component operator-command): the Service
# does not route to them, and the service's NetworkPolicy does not restrict
# them.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: opencloud-backup-provision-state-space
  labels:
    app.kubernetes.io/name: opencloud-backup
    app.kubernetes.io/component: operator-command
spec:
  suspend: true
  schedule: "0 0 31 2 *"
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: opencloud-backup
            app.kubernetes.io/component: operator-command
        spec:
          restartPolicy: Never
          serviceAccountName: opencloud-backupd
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
          # Creates the state Space and prints its id, the one line on
          # stdout: put it into STATE_SPACE_ID in your overlay's backupd.env.
          # Run it once, after everything else in backupd.env is filled in
          # (it reads the whole configuration): it refuses while
          # STATE_SPACE_ID is set, and a second run would create a second,
          # empty Space.
          - name: provision-state-space
            image: ghcr.io/knoppiks/opencloud-backupd
            args: ["provision-state-space"]
            envFrom:
            - configMapRef:
                name: opencloud-backup-env
            env:
            # The placeholder in backupd.env would make it refuse.
            - name: STATE_SPACE_ID
              value: ""
            - name: OC_SERVICE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: opencloud-backup-wrap-keys
                  key: service-account-id
            - name: OC_SERVICE_ACCOUNT_SECRET
              valueFrom:
                secretKeyRef:
                  name: opencloud-backup-wrap-keys
                  key: service-account-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: opencloud-backup-rotate-srw
  labels:
    app.kubernetes.io/name: opencloud-backup
    app.kubernetes.io/component: operator-command
spec:
  suspend: true
  schedule: "0 0 31 2 *"
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: opencloud-backup
            app.kubernetes.io/component: operator-command
        spec:
          restartPolicy: Never
          serviceAccountName: opencloud-backupd
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
          # Re-wraps every Space's server key envelope from the retiring SRW
          # key to the new one (decisions.md #18). With the service STOPPED
          # (scale the Deployment to 0): the new key in srw-wrapping-key, the
          # retiring one in srw-wrapping-key-old. Re-running finishes an
          # interrupted rotation. Remove the old key afterwards.
          - name: rotate-srw
            image: ghcr.io/knoppiks/opencloud-backupd
            args: ["rotate-srw", "-service-stopped"]
            envFrom:
            - configMapRef:
                name: opencloud-backup-env
            env:
            - name: OC_SERVICE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: opencloud-backup-wrap-keys
                  key: service-account-id
            - name: OC_SERVICE_ACCOUNT_SECRET
              valueFrom:
                secretKeyRef:
                  name: opencloud-backup-wrap-keys
                  key: service-account-secret
            - name: SRW_KEY
              valueFrom:
                secretKeyRef:
                  name: opencloud-backup-wrap-keys
                  key: srw-wrapping-key
            - name: SRW_KEY_OLD
              valueFrom:
                secretKeyRef:
                  name: opencloud-backup-wrap-keys
                  key: srw-wrapping-key-old
            - name: TW_KEY
              valueFrom:
                secretKeyRef:
                  name: opencloud-backup-wrap-keys
                  key: tw-wrapping-key
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
---
