apiVersion: batch/v1
kind: CronJob
metadata:
  name: opencloud-backup-takeout
  labels:
    app.kubernetes.io/name: opencloud-backup
    app.kubernetes.io/component: operator-command
spec:
  suspend: true
  schedule: "0 0 31 2 *"
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: opencloud-backup
            app.kubernetes.io/component: operator-command
        spec:
          restartPolicy: Never
          serviceAccountName: opencloud-backupd
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
          # Copies one Space's backups out of the bucket, still encrypted,
          # for its owner to open with their Recovery Key (README.md, "Take-
          # Out"). It needs neither OpenCloud nor the service, nor any key.
          # Your overlay sets the flags; the bucket's credentials come from
          # the Secret opencloud-backup-takeout (access-key-id,
          # secret-access-key), the output goes to the volume claim
          # opencloud-backup-takeout. Both are yours to create.
          - name: takeout
            image: ghcr.io/knoppiks/opencloud-backupd
            command: ["/takeout"]
            args:
            - -endpoint
            - REPLACE_ME_WITH_THE_S3_ENDPOINT
            - -bucket
            - REPLACE_ME_WITH_THE_BUCKET
            - -prefix
            - ""
            - -space
            - REPLACE_ME_WITH_THE_SPACE_ID
            - -out
            - /takeout/out
            - -v
            env:
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: opencloud-backup-takeout
                  key: access-key-id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: opencloud-backup-takeout
                  key: secret-access-key
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            volumeMounts:
            - name: takeout
              mountPath: /takeout
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: takeout
            persistentVolumeClaim:
              claimName: opencloud-backup-takeout
          - name: tmp
            emptyDir:
              medium: Memory
              sizeLimit: 64Mi
