apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencloud-backupd
  labels:
    app.kubernetes.io/name: opencloud-backup
    app.kubernetes.io/component: backupd
# The service and its operator commands never call the Kubernetes API. Their
# own account, with no role bound and no token mounted, keeps a compromised
# pod from inheriting whatever the namespace's default account was given.
automountServiceAccountToken: false
