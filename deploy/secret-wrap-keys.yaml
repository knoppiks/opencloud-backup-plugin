apiVersion: v1
kind: Secret
metadata:
  name: opencloud-backup-wrap-keys
  labels:
    app.kubernetes.io/name: opencloud-backup
    app.kubernetes.io/component: backupd
type: Opaque
# PLACEHOLDER ONLY — do not commit real keys. Provision out-of-band. Every
# REPLACE_ME here is refused at startup, so an unedited copy fails loudly.
#
# This holds every secret the service needs (all the same custody class; never in
# the admin UI, never logged, never in version control):
#
#   srw-wrapping-key         Server Runtime Wrap (SRW) key — wraps per-Space Data
#                            Keys so the unattended worker can run
#                            (decisions.md #1).
#   tw-wrapping-key          Target Wrap (TW) key — wraps S3 target credentials
#                            at rest for admin-managed targets (decisions.md
#                            #14). Distinct from the SRW key so the two rotate
#                            independently. The service refuses to start if both
#                            keys hold the same value.
#   service-account-id       OpenCloud service account the worker authenticates
#   service-account-secret   with (decisions.md #11). THE MOST VALUABLE SECRET
#                            HERE: it carries owner scope on every Space, which
#                            means plaintext. SRW and TW only ever unlock
#                            ciphertext; this one does not.
#
# Two optional keys the deployment manifest references, commented out there and
# here. Add them only if you use the feature; an unused empty key is one more
# thing to wonder about later:
#
#   smtp-password            password for operator notification mail.
#   bootstrap-s3-access-key-id / bootstrap-s3-secret-access-key
#                            credentials for the optional default target seeded
#                            on first start (decisions.md #12). They are sealed
#                            with the TW key the first time the service runs;
#                            after that they can be removed from the deployment.
#
# Either key can be retired without touching any backup: stop the service and run
# `backupd rotate-srw -service-stopped` / `backupd rotate-tw -service-stopped`
# with the old key in SRW_KEY_OLD / TW_KEY_OLD (decisions.md #18, README runbook).
#
# The S3 target credentials themselves are NOT here: with in-app target
# management (decisions.md #12) they are entered by the admin in the UI and
# stored TW-wrapped in the service's state Space (decisions.md #16) — only
# ciphertext at rest, and plaintext only in worker memory at run time. They are
# never written to the worker's filesystem, not even to the per-run kopia
# configuration (which connects through an in-memory handle instead).
#
# Generate 32-byte keys and create the secret imperatively (recommended over
# committing YAML):
#   kubectl create secret generic opencloud-backup-wrap-keys \
#     --from-literal=srw-wrapping-key="$(openssl rand -base64 32)" \
#     --from-literal=tw-wrapping-key="$(openssl rand -base64 32)" \
#     --from-literal=service-account-id="$OC_SERVICE_ACCOUNT_ID" \
#     --from-literal=service-account-secret="$OC_SERVICE_ACCOUNT_SECRET"
stringData:
  srw-wrapping-key: "REPLACE_ME_GENERATE_OUT_OF_BAND"
  tw-wrapping-key: "REPLACE_ME_GENERATE_OUT_OF_BAND"
  service-account-id: "REPLACE_ME_FROM_THE_OPENCLOUD_DEPLOYMENT"
  service-account-secret: "REPLACE_ME_FROM_THE_OPENCLOUD_DEPLOYMENT"
  # smtp-password: ""
  # bootstrap-s3-access-key-id: ""
  # bootstrap-s3-secret-access-key: ""
